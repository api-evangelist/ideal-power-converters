name: Ideal Power Converters
description: 'Ideal Power Inc. (NASDAQ: IPWR), formerly Ideal Power Converters, is an Austin,
  Texas power semiconductor company developing bidirectional bipolar junction transistor (B-TRAN)
  technology for ultra-low conduction losses, bidirectional current flow, and fast fault protection
  and switching. Its product portfolio includes B-TRAN power switches, SymCool power modules, and
  B-TRAN Known Good Die, targeting data centers, energy storage systems, power grids, solid-state
  circuit breakers, and EV charging infrastructure. Surfaced in the API Evangelist network as a
  Battery Ventures portfolio company; the company publishes a corporate and investor web presence
  but no public developer API or programmatic surface at this time.'
